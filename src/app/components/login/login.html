<div class="main-container">
  <div class="login-card">
    <h1 class="login-title">Inicio de Sesion</h1>

    <form (ngSubmit)="onSubmit()" class="login-form">

      <div class="form-group mb-4">
        <label class="form-label" name="email">Email</label>
        <input type="email" [(ngModel)]="email" name="email" class="form-input" placeholder="tu@email.com" required>
      </div>

      <div class="form-group mb-4 password-container">
        <label class="form-label" for="password">Contraseña</label>

        <div class="input-wrapper">
          <input [type]="mostrarPassword() ? 'text' : 'password'" [(ngModel)]="password" name="password" id="password"
            class="form-input" placeholder="••••••••" required>

          <button type="button" class="toggle-password-btn" (click)="habilitarPassword()" tabindex="-1">
            <i class="bi" [ngClass]="mostrarPassword() ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
          </button>
        </div>
      </div>

      <div class="d-grid gap-3">
        <button type="submit" [disabled]="loading()" class="btn-login-black">@if (loading()) { Cargando... } @else {
          Iniciar Sesion }</button>

        <!-- Alerta de error -->
        @if (errorMensaje()) {
        <div class="alert">
          {{ errorMensaje() }}
        </div>
        }

        @if (mensajeExitoso()) {
        <div class="neo-success-box">
          <i class="bi bi-controller fs-4"></i>
          {{ mensajeExitoso() }}
        </div>
        }

        <div class="accesos-test">
          <p>Accesos rápido </p>

          @for (u of usuariosTest; track u.email) {
          <button type="button" (click)="loginTest(u.email, u.password)" [disabled]="loading()">
            {{ u.label }}
          </button>
          }
        </div>

        <button type="button" class="btn-login-outline" routerLink="/registro">Crear Cuenta</button>
      </div>
    </form>
  </div>
</div>
